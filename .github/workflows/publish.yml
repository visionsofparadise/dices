name: Publish DICES Package

on:
  push:
    branches: [main]
    paths:
      - 'packages/dices/package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version is already published
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/dices/package.json').version")
          PUBLISHED=$(npm view "@xkore/dices@$PACKAGE_VERSION" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Type check
        if: steps.check.outputs.skip == 'false'
        run: |
          cd packages/dices
          npm run check

      - name: Run unit tests
        if: steps.check.outputs.skip == 'false'
        run: |
          cd packages/dices
          npm run unit

      - name: Run integration tests
        if: steps.check.outputs.skip == 'false'
        run: |
          cd packages/dices
          npm run integration

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: |
          cd packages/dices
          npm run build

      - name: Publish to NPM
        if: steps.check.outputs.skip == 'false'
        run: |
          cd packages/dices
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
